[project]
name = "rosida"
version = "0.2.0"
description = "Leichtgewichtige, native mathematische Notizbuch-Umgebung"
requires-python = ">=3.11"
dependencies = [
    "pyside6-essentials>=6.7",
    "polars",
    "sympy",
    "matplotlib",
    "numpy",
    "qtawesome",
]

[dependency-groups]
# Nur für den Windows-Build (build/win/build.ps1), nicht Teil des Laufzeit-Bundles.
win-build = [
    "pyinstaller",
]

[tool.uv]
package = false
